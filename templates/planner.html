<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Планировщик — RunJob</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23c0392b'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3ER%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a0a0a;
            color: #f0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            background: #2a1010;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #3a1010;
            flex-shrink: 0;
        }
        .header h2 { color: #e74c3c; font-size: 18px; }
        .nav-links { display: flex; gap: 12px; }
        .nav-links a {
            color: #e74c3c;
            text-decoration: none;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 6px;
        }
        .nav-links a:hover { background: rgba(231, 76, 60, 0.2); }
        .nav-links a.active { background: rgba(231, 76, 60, 0.3); }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .task-input-area {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .task-input-area input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #1a0a0a;
            color: #f0e0e0;
            font-size: 14px;
        }
        .task-input-area button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #c0392b;
            color: white;
            cursor: pointer;
        }

        .task-list { list-style: none; }
        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 10px;
            background: #1a0a0a;
            border-radius: 8px;
            margin-bottom: 6px;
        }
        .task-status {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .status-pending { background: #333; }
        .status-running { background: #f39c12; animation: pulse 1s infinite; }
        .status-success { background: #27ae60; }
        .status-error { background: #e74c3c; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .task-text { flex: 1; font-size: 13px; word-break: break-word; }
        .task-result { font-size: 11px; color: #999; margin-top: 4px; word-break: break-word; }

        .progress-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 8px 0;
            flex-shrink: 0;
        }
        .progress-fill { height: 100%; background: #e74c3c; border-radius: 2px; transition: width 0.3s; }

        .btn-run {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #27ae60;
            color: white;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-run:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>📋 Планировщик</h2>
            <div class="nav-links">
                <a href="/">💬 Чат</a>
                <a href="/planner" class="active">📋 План</a>
            </div>
        </div>

        <div class="task-input-area" style="margin: 16px 20px 0 20px;">
            <input type="text" id="taskInput" placeholder="Добавить задачу..." onkeypress="if(event.key==='Enter') addTask()">
            <button onclick="addTask()">Добавить</button>
        </div>

        <div class="scroll-area">
            <ul class="task-list" id="taskList"></ul>
        </div>

        <div style="padding: 0 20px;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width:0%"></div>
            </div>
            <button class="btn-run" id="btnRun" onclick="startPlan()">Запустить все задачи</button>
        </div>
    </div>

    <script>
        let tasks = [];

        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = tasks.map((t, i) => `
                <li class="task-item">
                    <div class="task-status ${getStatusClass(t.status)}">${getStatusIcon(t.status)}</div>
                    <div>
                        <div class="task-text">${t.text}</div>
                        ${t.result ? `<div class="task-result">${t.result.substring(0, 150)}</div>` : ''}
                    </div>
                </li>
            `).join('');
            updateProgress();
        }

        function getStatusClass(s) {
            return {pending:'status-pending',running:'status-running',success:'status-success',error:'status-error'}[s] || '';
        }
        function getStatusIcon(s) {
            return {pending:'○',running:'◉',success:'✓',error:'✕'}[s] || '';
        }

        function updateProgress() {
            const done = tasks.filter(t => t.status==='success' || t.status==='error').length;
            const pct = tasks.length ? Math.round(done/tasks.length*100) : 0;
            document.getElementById('progressFill').style.width = pct+'%';
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (!text) return;
            tasks.push({text, status:'pending', result:null});
            input.value = '';
            renderTasks();
        }

        async function startPlan() {
            if (!tasks.length) return;
            const btn = document.getElementById('btnRun');
            btn.disabled = true;
            btn.textContent = 'Выполняется...';

            const resp = await fetch('/api/plan/start', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({tasks: tasks.map(t => t.text)})
            });
            const {plan_id} = await resp.json();

            const interval = setInterval(async () => {
                const s = await fetch(`/api/plan/${plan_id}/status`);
                const data = await s.json();
                tasks = data.tasks;
                renderTasks();
                if (data.current === -1) {
                    clearInterval(interval);
                    btn.disabled = false;
                    btn.textContent = 'Запустить все задачи';
                }
            }, 500);
        }
    </script>
</body>
</html>
